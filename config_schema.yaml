properties:
  temp_file_retention:
    type: integer
    default: 3600
    description: "临时视频文件保留时间（秒）"
  max_search_results:
    type: integer
    default: 20
    description: "搜索结果返回数量"
  proxy:
    type: string
    default: ""
    description: "代理地址，如 http://host:port"
  cache_dir:
    type: string
    default: "/tmp/astrbot_plugin_hfapibilibili"
    description: "媒体缓存目录"
